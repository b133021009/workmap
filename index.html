        const hazardColors = {
            "墜落、滾落": "#ef4444", // Red
            "物體飛落": "#f97316",  // Orange
            "被夾、被捲": "#eab308",  // Yellow

        // Extract City Name helper
        function extractCity(address) {
            if (!address) return "未知";
            const match = address.match(/(臺北市|新北市|桃園市|臺中市|臺南市|高雄市|基隆市|新竹市|嘉義市|新竹縣|苗栗縣|彰化縣|南投縣|雲林縣|嘉義縣|屏東縣|宜蘭縣|花蓮縣|臺東縣|澎湖縣|金門縣|連江縣)/);
            return match ? match[0] : address.substring(0, 3);
        }

        document.addEventListener("DOMContentLoaded", function() {
            initMap();
            populateFilters();
            renderDashboard();
            initCharts();
        });

        function initMap() {
            // Centered at Taiwan
            map = L.map('map', {
                center: [23.8, 120.9],
                zoom: 8,
                zoomControl: false
            });

            // Add Zoom Control to Bottom Right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Dark Matter Tile Layer (CartoDB) with Fallback
            const tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            });

            tileLayer.on('tileerror', function() {
                // Fallback to OpenStreetMap standard tiles if dark tiles fail
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
            });

            tileLayer.addTo(map);

            // Marker Cluster Group
            markerClusterGroup = L.markerClusterGroup({
                chunkedLoading: true,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                zoomToBoundsOnClick: true,
                maxClusterRadius: 40
            });

            map.addLayer(markerClusterGroup);

            // Force map layout recalculation to ensure full render in iFrames
            setTimeout(() => {
                map.invalidateSize();
            }, 300);

            window.addEventListener('resize', () => {
                if (map) map.invalidateSize();
            });
        }

        function populateFilters() {
            const typeSelect = document.getElementById("filter-type");
            const citySelect = document.getElementById("filter-city");

            const types = [...new Set(rawIncidents.map(item => item.type))];
            const cities = [...new Set(rawIncidents.map(item => extractCity(item.address)))].sort();

            types.forEach(t => {
                const opt = document.createElement("option");
                opt.value = t;
                opt.textContent = t;
                typeSelect.appendChild(opt);
            });

            cities.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.textContent = c;
                citySelect.appendChild(opt);
            });
        }

        function renderDashboard() {
            markerClusterGroup.clearLayers();
            activeMarkers = {};

            const listContainer = document.getElementById("incident-list");
            listContainer.innerHTML = "";

            filteredData.forEach(item => {
                const color = hazardColors[item.type] || "#3b82f6";

                // Create Leaflet Icon
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-marker" style="background-color: ${color}; width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.8);">
                            <i class="fa-solid fa-triangle-exclamation text-xs"></i>
                           </div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                // Marker Instance
                const marker = L.marker([item.lat, item.lng], { icon: customIcon });

                // Popup Content
                const popupHTML = `
                    <div class="space-y-1">
                        <div class="text-xs text-red-400 font-bold">${item.type} (${item.date})</div>
                        <div class="font-bold text-sm text-white">${item.unit}</div>
                        <div class="text-xs text-gray-300">${item.address}</div>
                        <button onclick="openDrawer(${item.id})" class="mt-2 w-full py-1 bg-red-600/80 hover:bg-red-600 text-white rounded text-xs transition">
                            查看完整事故報告
                        </button>
                    </div>
                `;

                marker.bindPopup(popupHTML);
                marker.on('click', () => openDrawer(item.id));

                markerClusterGroup.addLayer(marker);
                activeMarkers[item.id] = marker;

                // Render List Card
                const card = document.createElement("div");
                card.className = "p-3 rounded-xl bg-gray-800/60 border border-gray-700/60 hover:border-red-500/60 transition cursor-pointer hover:bg-gray-800 flex flex-col justify-between space-y-2 group";
                card.onclick = () => focusIncident(item.id);

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <span class="px-2 py-0.5 text-[10px] font-bold rounded-full text-white" style="background-color: ${color}20; border: 1px solid ${color}60; color: ${color}">
                            ${item.type}
                        </span>
                        <span class="text-[11px] text-gray-400 font-mono">${item.date}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-sm text-gray-100 group-hover:text-red-400 transition">${item.unit}</h4>
                        <p class="text-xs text-gray-400 mt-1 line-clamp-1"><i class="fa-solid fa-location-dot text-gray-500 mr-1"></i>${item.address}</p>
                    </div>
                    <div class="flex items-center justify-between pt-1 border-t border-gray-700/40 text-[11px] text-gray-400">
                        <span><i class="fa-solid fa-industry mr-1 text-gray-500"></i>${item.industry}</span>
                        <span class="text-red-400 font-medium"><i class="fa-solid fa-user-xmark mr-1"></i>罹災: ${item.victims}人</span>
                    </div>
                `;

                listContainer.appendChild(card);
            });

            // Update Metrics
            document.getElementById("list-count").textContent = filteredData.length;
            document.getElementById("stat-total").textContent = filteredData.length;

            const counts = {};
            filteredData.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1);
            let topType = "無資料";
            let maxCount = 0;
            for (let t in counts) {
                if (counts[t] > maxCount) {
                    maxCount = counts[t];
                    topType = t;
                }
            }
            document.getElementById("stat-top-type").textContent = topType;
        }

        function filterData() {
            const searchText = document.getElementById("search-input").value.toLowerCase();
            const selectedType = document.getElementById("filter-type").value;
            const selectedCity = document.getElementById("filter-city").value;

            filteredData = rawIncidents.filter(item => {
                const matchesSearch = item.unit.toLowerCase().includes(searchText) || 
                                      item.address.toLowerCase().includes(searchText) || 
                                      item.industry.toLowerCase().includes(searchText);

                const matchesType = (selectedType === "ALL") || (item.type === selectedType);
                const matchesCity = (selectedCity === "ALL") || (extractCity(item.address) === selectedCity);

                return matchesSearch && matchesType && matchesCity;
            });

            renderDashboard();
            updateCharts();
        }

        function focusIncident(id) {
            const item = rawIncidents.find(i => i.id === id);
            if (!item) return;

            map.flyTo([item.lat, item.lng], 15, { duration: 1.2 });
            const marker = activeMarkers[id];
            if (marker) {
                setTimeout(() => {
                    markerClusterGroup.zoomToShowLayer(marker, () => {
                        marker.openPopup();
                    });
                }, 400);
            }
            openDrawer(id);
        }

        function openDrawer(id) {
            const item = rawIncidents.find(i => i.id === id);
            if (!item) return;

            document.getElementById("drawer-title").textContent = item.unit;
            document.getElementById("drawer-date").textContent = item.date;
            document.getElementById("drawer-industry").textContent = item.industry;
            document.getElementById("drawer-address").textContent = item.address;
            document.getElementById("drawer-agency").textContent = item.agency;
            document.getElementById("drawer-location").textContent = item.location || "肇災處現場";

            const badge = document.getElementById("drawer-type-badge");
            badge.textContent = item.type;
            const color = hazardColors[item.type] || "#ef4444";
            badge.style.backgroundColor = `${color}20`;
            badge.style.borderColor = `${color}60`;
            badge.style.color = color;

            const googleBtn = document.getElementById("drawer-google-map-btn");
            googleBtn.onclick = () => {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address)}`, '_blank');
            };

            const drawer = document.getElementById("detail-drawer");
            drawer.classList.remove("translate-x-[110%]");
            drawer.classList.add("translate-x-0");
        }

        function closeDrawer() {
            const drawer = document.getElementById("detail-drawer");
            drawer.classList.remove("translate-x-0");
            drawer.classList.add("translate-x-[110%]");
        }

        function resetFilters() {
            document.getElementById("search-input").value = "";
            document.getElementById("filter-type").value = "ALL";
            document.getElementById("filter-city").value = "ALL";
            filterData();
            map.flyTo([23.8, 120.9], 8);
            closeDrawer();
        }

        function toggleStatsModal() {
            const modal = document.getElementById("stats-modal");
            modal.classList.toggle("hidden");
        }

        function initCharts() {
            const ctxType = document.getElementById('typeChart').getContext('2d');
            const ctxCity = document.getElementById('cityChart').getContext('2d');

            typeChartInstance = new Chart(ctxType, {
                type: 'doughnut',
                data: getChartData().typeData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#d1d5db', font: { size: 11 } } }
                    }
                }
            });

            cityChartInstance = new Chart(ctxCity, {
                type: 'bar',
                data: getChartData().cityData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
                        y: { ticks: { color: '#9ca3af', precision: 0 }, grid: { color: '#374151' } }
                    }
                }
            });
        }

        function updateCharts() {
            if (!typeChartInstance || !cityChartInstance) return;

            const { typeData, cityData } = getChartData();
            typeChartInstance.data = typeData;
            typeChartInstance.update();

            cityChartInstance.data = cityData;
            cityChartInstance.update();
        }

        function getChartData() {
            const typeCounts = {};
            filteredData.forEach(i => typeCounts[i.type] = (typeCounts[i.type] || 0) + 1);

            const typeLabels = Object.keys(typeCounts);
            const typeValues = Object.values(typeCounts);
            const typeBgColors = typeLabels.map(t => hazardColors[t] || '#3b82f6');

            const cityCounts = {};
            filteredData.forEach(i => {
                const city = extractCity(i.address);
                cityCounts[city] = (cityCounts[city] || 0) + 1;
            });

            const cityLabels = Object.keys(cityCounts);
            const cityValues = Object.values(cityCounts);

            return {
                typeData: {
                    labels: typeLabels,
                    datasets: [{
                        data: typeValues,
                        backgroundColor: typeBgColors,
                        borderWidth: 0
                    }]
                },
                cityData: {
                    labels: cityLabels,
                    datasets: [{
                        data: cityValues,
                        backgroundColor: '#f97316',
                        borderRadius: 6
                    }]
                }
